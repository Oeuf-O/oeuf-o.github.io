<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drink Slide — ミニゲーム</title>
    <link rel="stylesheet" href="drink_slide_revised.css" />
  </head>

  <body>
    <main id="game">
      <div class="head">
        <div>
          <div class="kicker">DRINK PUZZLE</div>
          <div class="title">🥤 Drink Slide</div>
        </div>
        <button id="reset">↻ 最初からリセット</button>
      </div>
      <div class="stats">
        <div class="stat">
          <small>スコア</small><strong id="score">0</strong>
        </div>
        <div class="stat">
          <small>ベスト</small><strong id="best">0</strong>
        </div>
        <div class="stat">
          <small>合体回数</small><strong id="merges">0</strong>
        </div>
      </div>
      <div class="next-preview">
        <span>次に発射する飲み物</span><strong id="nextTop">🍋</strong
        ><small id="nextName">レモン</small>
      </div>
      <div class="arena">
        <canvas
          id="canvas"
          aria-label="飲み物を滑らせて合体させるゲーム"
        ></canvas>
        <div class="overlay" id="overlay">
          <div>
            <div style="font-size: 54px">🥤</div>
            <div style="font-size: 26px; font-weight: 900; margin: 10px 0">
              ゲーム終了！
            </div>
            <div id="final" style="margin-bottom: 18px"></div>
            <button
              id="again"
              style="background: #f4a340; color: #fff; border: 0"
            >
              続ける
            </button>
          </div>
        </div>
        <div class="overlay" id="overlay-clear">
          <div>
            <div style="font-size: 54px">🍻</div>
            <div style="font-size: 26px; font-weight: 900; margin: 10px 0">
              クリア！
            </div>
            <div id="final-clear" style="margin-bottom: 18px"></div>
            <button
              id="again-clear"
              style="background: #f4a340; color: #fff; border: 0"
            >
              続ける
            </button>
          </div>
        </div>
      </div>
      <div class="hint" id="hint">
        下の飲み物をドラッグして、狙いをつけて離そう！<br />同じ飲み物同士がぶつかると、ひとつ上の飲み物に進化するよ。
      </div>
      <div class="levels" id="levels"></div>
      <div
        style="
          display: flex;
          justify-content: flex-end;
          align-items: center;
          margin-top: 12px;
          font-size: 12px;
          color: #64748b;
        "
      >
        <span>🎯 ねらって合体コンボ！</span>
      </div>
    </main>
    <script src="drink_slide_revised.js"></script>
  </body>
</html>
