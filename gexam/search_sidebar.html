<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <base target="page-frame">
    <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
    <script src="/pagefind/pagefind-ui.js"></script>
    <style>
      .search-panel {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 8px 24px rgb(15 23 42 / 5%);
      }

      .search-panel {
        align-self: start;
        padding: 1.25rem;
      }

      .search-heading {
        margin: 0 0 0.75rem;
        font-size: 1rem;
      }

      @media (max-width: 760px) {
        .search-panel {
          padding: 1rem;
        }
      }
    </style>
</head>
<body>
    <div id="search"></div>

    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            new PagefindUI({ 
                element: "#search",
                showSubResults: true
            });
        });
    </script>

</body>
</html>
