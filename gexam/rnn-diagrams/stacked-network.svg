<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="550" viewBox="0 0 1250 550" role="img" aria-labelledby="title desc"><title id="title">Stacked recurrent network across time</title><desc id="desc">At each sequence step input passes through five stacked recurrent layers, each with its own cells and gates, then an output layer. Hidden states are carried across time within each recurrent layer.</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8z" fill="#52647a"/></marker></defs><rect width="1250" height="550" rx="24" fill="#f7f9fc"/><text x="625" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#182b43">A stacked LSTM network, shown across time</text>
<text x="340" y="98" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#52647a">Step t−1</text><text x="890" y="98" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#52647a">Step t</text>
<rect x="60" y="125" width="150" height="58" rx="13" fill="#e4f1ff" stroke="#4688c7" stroke-width="2"/><text x="135" y="161" text-anchor="middle" font-family="Arial" font-size="20" fill="#183c5d">Input xₜ₋₁</text>
<rect x="60" y="390" width="150" height="58" rx="13" fill="#e4f1ff" stroke="#4688c7" stroke-width="2"/><text x="135" y="426" text-anchor="middle" font-family="Arial" font-size="20" fill="#183c5d">Input xₜ</text>
<g font-family="Arial" text-anchor="middle"><rect x="260" y="120" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="380" y="148" font-size="18" fill="#164a2b">Recurrent layer 1</text><text x="380" y="171" font-size="14" fill="#24583a">many cells + gates</text><rect x="260" y="205" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="380" y="233" font-size="18" fill="#164a2b">Recurrent layer 2</text><text x="380" y="256" font-size="14" fill="#24583a">many cells + gates</text><rect x="260" y="290" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="380" y="318" font-size="18" fill="#164a2b">Recurrent layer 3</text><text x="380" y="341" font-size="14" fill="#24583a">many cells + gates</text><rect x="260" y="375" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="380" y="403" font-size="18" fill="#164a2b">Recurrent layer 4</text><text x="380" y="426" font-size="14" fill="#24583a">many cells + gates</text><rect x="260" y="460" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="380" y="488" font-size="18" fill="#164a2b">Recurrent layer 5</text><text x="380" y="511" font-size="14" fill="#24583a">many cells + gates</text></g>
<rect x="670" y="120" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="790" y="148" text-anchor="middle" font-family="Arial" font-size="18" fill="#164a2b">Recurrent layer 1</text><text x="790" y="171" text-anchor="middle" font-family="Arial" font-size="14" fill="#24583a">own gate parameters</text><rect x="670" y="205" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="790" y="233" text-anchor="middle" font-family="Arial" font-size="18" fill="#164a2b">Recurrent layer 2</text><text x="790" y="256" text-anchor="middle" font-family="Arial" font-size="14" fill="#24583a">own gate parameters</text><rect x="670" y="290" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="790" y="318" text-anchor="middle" font-family="Arial" font-size="18" fill="#164a2b">Recurrent layer 3</text><text x="790" y="341" text-anchor="middle" font-family="Arial" font-size="14" fill="#24583a">own gate parameters</text><rect x="670" y="375" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="790" y="403" text-anchor="middle" font-family="Arial" font-size="18" fill="#164a2b">Recurrent layer 4</text><text x="790" y="426" text-anchor="middle" font-family="Arial" font-size="14" fill="#24583a">own gate parameters</text><rect x="670" y="460" width="240" height="64" rx="13" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="790" y="488" text-anchor="middle" font-family="Arial" font-size="18" fill="#164a2b">Recurrent layer 5</text><text x="790" y="511" text-anchor="middle" font-family="Arial" font-size="14" fill="#24583a">own gate parameters</text>
<g stroke="#52647a" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M210 154H250"/><path d="M210 419H250"/><path d="M500 152H660"/><path d="M500 237H660"/><path d="M500 322H660"/><path d="M500 407H660"/><path d="M500 492H660"/><path d="M380 184V195"/><path d="M380 269V280"/><path d="M380 354V365"/><path d="M380 439V450"/><path d="M790 184V195"/><path d="M790 269V280"/><path d="M790 354V365"/><path d="M790 439V450"/><path d="M910 152H985"/><path d="M910 237H985"/><path d="M910 322H985"/><path d="M910 407H985"/><path d="M910 492H985"/></g>
<rect x="990" y="220" width="200" height="105" rx="17" fill="#ffe8e7" stroke="#ca6760" stroke-width="2"/><text x="1090" y="264" text-anchor="middle" font-family="Arial" font-size="19" fill="#642d2b">Output layer</text><text x="1090" y="296" text-anchor="middle" font-family="Arial" font-size="21" fill="#642d2b">prediction ŷₜ</text>
<text x="570" y="110" text-anchor="middle" font-family="Arial" font-size="14" fill="#52647a">State carries forward within each layer across steps →</text><text x="625" y="540" text-anchor="middle" font-family="Arial" font-size="15" fill="#52647a">A layer with many units computes many gate values; only recurrent layers have LSTM/GRU gates.</text></svg>
