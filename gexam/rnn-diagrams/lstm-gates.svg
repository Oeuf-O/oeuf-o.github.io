<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">LSTM gates regulate memory</title><desc id="desc">The forget gate filters prior cell state, the input gate controls new candidate information, and their combination forms the new cell state. The output gate determines the new hidden state.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8z" fill="#52647a"/></marker></defs><rect width="1200" height="570" rx="24" fill="#f7f9fc"/><text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#182b43">Inside an LSTM cell: gates regulate information</text>
<rect x="55" y="110" width="235" height="78" rx="15" fill="#fff0d9" stroke="#d8952e" stroke-width="2"/><text x="172" y="143" text-anchor="middle" font-family="Arial" font-size="18" fill="#63430f">Previous cell memory</text><text x="172" y="172" text-anchor="middle" font-family="Arial" font-size="22" fill="#63430f">cₜ₋₁</text>
<rect x="55" y="255" width="235" height="78" rx="15" fill="#e4f1ff" stroke="#4688c7" stroke-width="2"/><text x="172" y="302" text-anchor="middle" font-family="Arial" font-size="22" fill="#183c5d">Current input xₜ</text>
<rect x="55" y="400" width="235" height="78" rx="15" fill="#eee8ff" stroke="#8262c5" stroke-width="2"/><text x="172" y="433" text-anchor="middle" font-family="Arial" font-size="18" fill="#3c2d63">Previous hidden state</text><text x="172" y="462" text-anchor="middle" font-family="Arial" font-size="22" fill="#3c2d63">hₜ₋₁</text>
<rect x="375" y="95" width="250" height="85" rx="16" fill="#fff3dc" stroke="#d8952e" stroke-width="2"/><text x="500" y="130" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#63430f">Forget gate fₜ</text><text x="500" y="157" text-anchor="middle" font-family="Arial" font-size="16" fill="#63430f">how much old memory to keep</text>
<rect x="375" y="220" width="250" height="85" rx="16" fill="#e4f1ff" stroke="#4688c7" stroke-width="2"/><text x="500" y="255" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#183c5d">Input gate iₜ</text><text x="500" y="282" text-anchor="middle" font-family="Arial" font-size="16" fill="#183c5d">how much new info to write</text>
<rect x="375" y="345" width="250" height="85" rx="16" fill="#e7f7ee" stroke="#43a36a" stroke-width="2"/><text x="500" y="380" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#164a2b">Candidate memory c̃ₜ</text><text x="500" y="407" text-anchor="middle" font-family="Arial" font-size="16" fill="#24583a">new content considered</text>
<rect x="725" y="180" width="220" height="160" rx="20" fill="#e7f7ee" stroke="#43a36a" stroke-width="3"/><text x="835" y="230" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#164a2b">Combine</text><text x="835" y="269" text-anchor="middle" font-family="Arial" font-size="19" fill="#24583a">kept old memory</text><text x="835" y="300" text-anchor="middle" font-family="Arial" font-size="19" fill="#24583a">+ selected new info</text>
<rect x="1000" y="205" width="160" height="80" rx="16" fill="#fff0d9" stroke="#d8952e" stroke-width="2"/><text x="1080" y="237" text-anchor="middle" font-family="Arial" font-size="18" fill="#63430f">New cell state</text><text x="1080" y="266" text-anchor="middle" font-family="Arial" font-size="22" fill="#63430f">cₜ</text>
<rect x="725" y="410" width="220" height="75" rx="16" fill="#eee8ff" stroke="#8262c5" stroke-width="2"/><text x="835" y="441" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#3c2d63">Output gate oₜ</text><text x="835" y="466" text-anchor="middle" font-family="Arial" font-size="15" fill="#3c2d63">what memory to expose</text>
<rect x="1000" y="390" width="160" height="80" rx="16" fill="#eee8ff" stroke="#8262c5" stroke-width="2"/><text x="1080" y="422" text-anchor="middle" font-family="Arial" font-size="18" fill="#3c2d63">New hidden state</text><text x="1080" y="451" text-anchor="middle" font-family="Arial" font-size="22" fill="#3c2d63">hₜ</text>
<path d="M290 148H365" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/><path d="M290 294C330 294 335 262 365 262" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/><path d="M290 430C330 430 335 390 365 390" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/>
<path d="M625 138C680 138 677 205 715 220" fill="none" stroke="#d8952e" stroke-width="3" marker-end="url(#a)"/><path d="M625 262H715" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/><path d="M625 390C680 390 680 315 715 300" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/><path d="M945 260H990" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/><path d="M290 294C460 500 660 470 715 450" fill="none" stroke="#52647a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><path d="M945 447H990" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/>
<text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="17" fill="#52647a">Gate values are learned, input-dependent controls (typically between 0 and 1), not fixed time weights.</text></svg>
