<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">One recurrent sequence step</title><desc id="desc">Current input and previous hidden state enter a recurrent cell, which outputs a new hidden state and prediction. An LSTM also carries cell state forward.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8z" fill="#52647a"/></marker></defs>
<rect width="1200" height="420" rx="24" fill="#f7f9fc"/>
<text x="600" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#182b43">One sequence step (position t)</text>
<rect x="65" y="118" width="235" height="78" rx="16" fill="#e4f1ff" stroke="#4688c7" stroke-width="2"/><text x="182" y="165" text-anchor="middle" font-family="Arial" font-size="22" fill="#183c5d">Current input xₜ</text>
<rect x="65" y="260" width="235" height="78" rx="16" fill="#fff0d9" stroke="#d8952e" stroke-width="2"/><text x="182" y="293" text-anchor="middle" font-family="Arial" font-size="19" fill="#63430f">Previous hidden state</text><text x="182" y="322" text-anchor="middle" font-family="Arial" font-size="22" fill="#63430f">hₜ₋₁</text>
<rect x="420" y="145" width="300" height="165" rx="20" fill="#e7f7ee" stroke="#43a36a" stroke-width="3"/><text x="570" y="205" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#164a2b">Recurrent cell</text><text x="570" y="245" text-anchor="middle" font-family="Arial" font-size="18" fill="#24583a">RNN, LSTM, or GRU</text><text x="570" y="278" text-anchor="middle" font-family="Arial" font-size="16" fill="#42634d">combines input + carried state</text>
<path d="M300 157H410" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/><path d="M300 298C350 298 350 250 410 250" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/>
<rect x="855" y="92" width="270" height="78" rx="16" fill="#eee8ff" stroke="#8262c5" stroke-width="2"/><text x="990" y="124" text-anchor="middle" font-family="Arial" font-size="19" fill="#3c2d63">New hidden state</text><text x="990" y="151" text-anchor="middle" font-family="Arial" font-size="22" fill="#3c2d63">hₜ</text>
<rect x="855" y="210" width="270" height="78" rx="16" fill="#ffe8e7" stroke="#ca6760" stroke-width="2"/><text x="990" y="257" text-anchor="middle" font-family="Arial" font-size="22" fill="#642d2b">Prediction ŷₜ</text>
<rect x="855" y="325" width="270" height="64" rx="16" fill="#fff0d9" stroke="#d8952e" stroke-width="2"/><text x="990" y="365" text-anchor="middle" font-family="Arial" font-size="21" fill="#63430f">LSTM cell state cₜ</text>
<path d="M720 190C780 190 790 131 845 131" fill="none" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/><path d="M720 220H845" stroke="#52647a" stroke-width="3" marker-end="url(#a)"/><path d="M720 270C780 270 790 356 845 356" fill="none" stroke="#d8952e" stroke-width="3" marker-end="url(#a)"/>
<text x="600" y="400" text-anchor="middle" font-family="Arial" font-size="16" fill="#52647a">At the next step, hₜ (and for LSTM, cₜ) is carried forward.</text>
</svg>
