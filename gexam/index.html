<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A personal wiki for browsing and searching notes."
    />
    <title>Personal Wiki</title>
    <link href="pagefind/pagefind-ui.css" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #1e293b;
        background: #f1f5f9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --line: #dbe3ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .site-header {
        padding: 1rem clamp(1rem, 4vw, 3rem);
        color: #fff;
        background: #172554;
      }

      .site-name {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: -0.03em;
      }

      .site-note {
        margin: 0.25rem 0 0;
        color: #cbd5e1;
        font-size: 0.9rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 1.25rem;
        max-width: 1600px;
        min-height: calc(100vh - 78px);
        margin: 0 auto;
        padding: 1.25rem;
      }

      .search-panel,
      .content-panel {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 8px 24px rgb(15 23 42 / 5%);
      }

      .search-panel {
        align-self: start;
        padding: 1.25rem;
      }

      .search-heading {
        margin: 0 0 0.75rem;
        font-size: 1rem;
      }

      .content-panel {
        display: flex;
        flex-direction: column;
      }

      .page-frame {
        display: block;
        width: 100%;
        min-height: 70vh;
        flex: 1;
        border: 0;
        background: #fff;
      }

      @media (max-width: 760px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 0.85rem;
          padding: 0.85rem;
        }

        .search-panel {
          padding: 1rem;
        }

        .page-frame {
          min-height: 68vh;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-name">Personal Wiki</h1>
      <p class="site-note">A home for notes, references, and ideas</p>
    </header>
    <main class="layout">
      <section class="search-panel" aria-labelledby="search-heading">
        <iframe
          class="page-frame"
          id="search-frame"
          src="search_sidebar.html"
          title="Search">
        </iframe>
      </section>
      <section class="content-panel" aria-label="Featured page">
        <iframe
          class="page-frame"
          id="page-frame"
          name="page-frame"
          src="treesearch.html"
          title="Summary of Tree Search Algorithms"
        ></iframe>
      </section>
    </main>
    <script src="pagefind/pagefind-ui.js"></script>
    <script>
      new PagefindUI({
        element: "#search",
        showImages: false,
      });
    </script>
  </body>
</html>
